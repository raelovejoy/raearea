<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Rae Lovejoy — systems-minded generalist, synthesizer, occasional builder, and compulsive connector of things." />
  <meta name="color-scheme" content="dark" />
  <title>/whoami · Rae Lovejoy</title>
  <link rel="icon" href="/favicon.png" type="image/png" />

  <style>
    @font-face {
      font-family: "IBM Plex Mono";
      src: url("/whoami/assets/fonts/IBMPlexMono-Regular.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "VT323";
      src: url("/whoami/assets/fonts/VT323-Regular.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg-a: #120725;
      --bg-b: #241044;
      --bg-c: #321238;
      --text: #eaf8ff;
      --muted: #b7bdca;
      --link: #70f8ff;
      --hover: #ffd0f4;
      --accent: #ff6fcc;
      --border: rgba(255, 255, 255, 0.14);
      --panel: rgba(0, 0, 0, 0.18);
      --max: 860px;
    }

    * { box-sizing: border-box; }

    html {
      min-height: 100%;
      background: linear-gradient(135deg, var(--bg-a), var(--bg-b), var(--bg-c));
      background-attachment: fixed;
      color: var(--text);
      font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      scroll-behavior: smooth;
    }

    body {
      min-height: 100%;
      margin: 0;
      line-height: 1.7;
      font-size: 1rem;
    }

    a {
      color: var(--link);
      text-underline-offset: 0.16em;
      text-decoration-thickness: 1px;
    }

    a:hover { color: var(--hover); }

    a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
      border-radius: 4px;
    }

    .skip-link {
      position: absolute;
      left: -9999px;
      top: 0;
      z-index: 1000;
      padding: 0.65rem 0.8rem;
      background: #050505;
      border: 1px solid var(--border);
    }

    .skip-link:focus {
      left: 1rem;
      top: 1rem;
    }

    header {
      width: min(100% - 2.5rem, 980px);
      margin: 0 auto;
      padding: 3.25rem 0 0;
    }

    .site-head {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 2rem;
      align-items: end;
      padding-bottom: 1.35rem;
      border-bottom: 1px solid var(--border);
    }

    .logo-swap {
      position: relative;
      display: block;
      width: 160px;
      max-width: 42vw;
    }

    .logo-swap img {
      display: block;
      width: 100%;
      height: auto;
    }

    .logo-easter {
      position: absolute;
      inset: 0;
      opacity: 0;
      object-fit: contain;
      pointer-events: none;
    }

    @media (hover: hover) and (pointer: fine) {
      .logo:hover .logo-main,
      .logo:focus-visible .logo-main {
        opacity: 0;
      }

      .logo:hover .logo-easter,
      .logo:focus-visible .logo-easter {
        opacity: 1;
      }
    }

    .primary {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 0.4rem 1.1rem;
      font-size: 0.8rem;
    }

    .primary a {
      color: var(--muted);
      text-decoration: underline;
      text-decoration-color: rgba(255,255,255,0.32);
      text-underline-offset: 0.18em;
      text-decoration-thickness: 1px;
      white-space: nowrap;
    }

    .primary a:hover {
      color: var(--hover);
      text-decoration-color: currentColor;
    }

    .primary a[aria-current="page"] {
      color: var(--text);
      text-decoration-color: var(--text);
      font-weight: 700;
    }

    main {
      width: min(100% - 3rem, var(--max));
      margin: 2.5rem auto 4rem;
    }

    article { padding: 0.2rem 0; }

    h1,
    h2 {
      font-family: "VT323", "IBM Plex Mono", monospace;
      font-weight: 400;
      letter-spacing: 0.01em;
    }

    h1 {
      margin: 0 0 1.1rem;
      font-size: clamp(2.8rem, 9vw, 4.5rem);
      line-height: 1;
      color: #fff;
      text-shadow: 0 0 18px rgba(112, 248, 255, 0.22);
    }

    h2 {
      margin: 3.2rem 0 1rem;
      font-size: clamp(1.85rem, 5vw, 2.35rem);
      line-height: 1.1;
      color: #fff;
    }

    p { margin: 0 0 1.15rem; }

    ul {
      margin: 0.7rem 0 1.4rem;
      padding-left: 1.35rem;
    }

    li { margin: 0.55rem 0; }
    strong { color: #fff; }

    details {
      margin: 0.85rem 0;
      padding: 0 1.1rem;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 0.6rem;
    }

    summary {
      position: relative;
      padding: 0.9rem 2.5rem 0.9rem 0;
      color: var(--link);
      cursor: pointer;
      font-family: "VT323", "IBM Plex Mono", monospace;
      font-size: clamp(1.45rem, 4vw, 1.8rem);
      line-height: 1.2;
      list-style: none;
    }

    summary::-webkit-details-marker { display: none; }

    summary::after {
      position: absolute;
      top: 50%;
      right: 0;
      color: var(--muted);
      content: "[+]";
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.85rem;
      transform: translateY(-50%);
    }

    details[open] { padding-bottom: 0.15rem; }

    details[open] summary {
      margin-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }

    details[open] summary::after { content: "[−]"; }

    summary:hover { color: var(--hover); }

    summary:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
      border-radius: 4px;
    }

    details > :last-child { margin-bottom: 1rem; }

    hr {
      margin: 3.2rem 0 1.6rem;
      border: 0;
      border-top: 1px solid var(--border);
    }

    sub {
      color: var(--muted);
      font-size: 0.8rem;
    }

    footer {
      max-width: var(--max);
      margin: 0 auto;
      padding: 0 1.5rem 2.5rem;
      color: var(--muted);
      font-size: 0.8rem;
      text-align: center;
    }

    @media (max-width: 720px) {
      header {
        width: min(100% - 1.5rem, 980px);
        padding-top: 2rem;
      }

      .site-head {
        grid-template-columns: 1fr;
        align-items: start;
        gap: 1rem;
      }

      .primary {
        justify-content: flex-start;
      }

      main { width: min(100% - 2rem, var(--max)); }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
    }
  </style>
</head>

    <div class="site-head">

          <img class="logo-main" src="/index_files/raearea.png" alt="rae area">
          <img class="logo-easter" src="/index_files/rle.gif" alt="" aria-hidden="true">
        </span>
      </a>

      <nav class="primary" aria-label="Primary routes">
        <a href="/#projects">projects</a>
        <a href="/whoami" aria-current="page">/whoami</a>
        <a href="/contact">/contact</a>
        <a href="/colophon">/colophon</a>
      </nav>
    </div>
  </header>

  <main id="content">
    <article>

    </article>
  </main>

  <footer>
    <a href="#top">↑ top</a> · this page is generated from <code>whoami/whoami.md</code>
  </footer>
</body>
</html>
