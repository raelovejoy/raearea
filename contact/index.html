<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>/contact — [rae area]</title>

  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="ai" content="noai">
  <meta name="openai-site-verification" content="noai">
  <meta name="description" content="Contact Rae Lovejoy.">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#090909">

  <link rel="canonical" href="https://raearea.net/contact/">
  <link rel="author" href="/whoami">
  <link rel="icon" type="image/png" href="/favicon.png">

  <style>
    @font-face {
      font-family: "IBM Plex Mono";
      src: url("/whoami/assets/fonts/IBMPlexMono-Regular.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "VT323";
      src: url("/whoami/assets/fonts/VT323-Regular.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg: #090909;
      --fg: #eeeeee;
      --soft: #b5b5b5;
      --dim: #767676;
      --line: #282828;
      --line-bright: #444;
      --link: #84f6ff;
      --pink: #ff8ad8;
      --max: 860px;
    }

    * { box-sizing: border-box; }

    html {
      min-height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    body {
      min-height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.7;
    }

    a {
      color: inherit;
      text-decoration-thickness: 1px;
      text-underline-offset: 0.18em;
      text-decoration-color: #666;
    }

    a:hover {
      color: var(--link);
      text-decoration-color: currentColor;
    }

    a:focus-visible {
      outline: 2px solid var(--pink);
      outline-offset: 4px;
    }

    .skip-link {
      position: absolute;
      left: -10000px;
      top: 0;
      z-index: 100;
      padding: 0.6rem 0.8rem;
      background: #000;
      color: #fff;
      border: 1px solid var(--line-bright);
    }

    .skip-link:focus {
      left: 1rem;
      top: 1rem;
    }

    .page {
      width: min(100% - 2.5rem, var(--max));
      margin: 0 auto;
      padding: 3rem 0 4rem;
    }

    .site-head {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 2rem;
      align-items: end;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid var(--line);
    }

    .logo-swap {
      position: relative;
      display: block;
      width: 145px;
      max-width: 40vw;
    }

    .logo-swap img {
      display: block;
      width: 100%;
      height: auto;
    }

    .logo-easter {
      position: absolute;
      inset: 0;
      opacity: 0;
      object-fit: contain;
      pointer-events: none;
    }

    @media (hover: hover) and (pointer: fine) {
      .logo:hover .logo-main,
      .logo:focus-visible .logo-main {
        opacity: 0;
      }

      .logo:hover .logo-easter,
      .logo:focus-visible .logo-easter {
        opacity: 1;
      }
    }

    .primary {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 0.4rem 1rem;
      font-size: 0.78rem;
    }

    .primary a {
      color: var(--soft);
      text-decoration: underline;
      text-decoration-color: #555;
      text-underline-offset: 0.18em;
      border-bottom: 0;
    }

    .primary a[aria-current="page"] {
      color: var(--fg);
      text-decoration-color: var(--fg);
      font-weight: 700;
    }

    main {
      padding-top: 3.25rem;
    }

    h1,
    h2 {
      font-family: "VT323", "IBM Plex Mono", monospace;
      font-weight: 400;
    }

    h1 {
      margin: 0 0 0.8rem;
      font-size: clamp(3rem, 8vw, 4.8rem);
      line-height: 1;
    }

    .lede {
      max-width: 43rem;
      margin: 0 0 3rem;
      color: var(--soft);
      font-size: 0.9rem;
    }

    section {
      padding: 1.2rem 0 2rem;
      border-top: 1px solid var(--line);
    }

    h2 {
      margin: 0 0 1rem;
      font-size: 1.8rem;
    }

    dl {
      margin: 0;
    }

    .row {
      display: grid;
      grid-template-columns: minmax(8rem, 0.28fr) 1fr;
      gap: 1rem;
      padding: 0.8rem 0;
      border-bottom: 1px dotted var(--line);
      font-size: 0.8rem;
    }

    dt,
    dd {
      margin: 0;
    }

    dt {
      color: var(--dim);
    }

    dd {
      color: var(--soft);
    }

    dd strong {
      color: var(--fg);
      font-weight: 400;
    }

    .secondary {
      display: block;
      margin-top: 0.2rem;
      color: var(--dim);
      font-size: 0.72rem;
    }

    footer {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: baseline;
      gap: 1rem 2rem;
      margin-top: 2.5rem;
      padding-top: 1.2rem;
      border-top: 1px solid var(--line);
      color: var(--dim);
      font-size: 0.72rem;
    }

    .social {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem 1rem;
    }

    .social a {
      color: var(--soft);
    }

    .etc {
      color: #6f6f6f;
      font-size: 0.68rem;
      letter-spacing: 0.04em;
    }

    @media (max-width: 680px) {
      .page {
        width: min(100% - 1.5rem, var(--max));
        padding-top: 2rem;
      }

      .site-head {
        grid-template-columns: 1fr;
        gap: 1rem;
      }

      .primary {
        justify-content: flex-start;
      }

      .row {
        grid-template-columns: 1fr;
        gap: 0.1rem;
      }
    }

    @media print {
      :root {
        --bg: #fff;
        --fg: #000;
        --soft: #333;
        --dim: #555;
        --line: #bbb;
        --link: #000;
      }

      body { background: #fff; }
      .primary { display: none; }
      a { text-decoration: underline; }
    }
  </style>
</head>

<body>
  <a class="skip-link" href="#content">Skip to content</a>

  <div class="page">
    <header class="site-head">
      <a class="logo" href="/" aria-label="rae area home">
        <span class="logo-swap">
          <img class="logo-main" src="/index_files/raearea.png" alt="rae area">
          <img class="logo-easter" src="/index_files/rle.gif" alt="" aria-hidden="true">
        </span>
      </a>

      <nav class="primary" aria-label="Primary routes">
        <a href="/#projects">projects</a>
        <a href="/whoami">/whoami</a>
        <a href="/contact" aria-current="page">/contact</a>
        <a href="/colophon">/colophon</a>
      </nav>
    </header>

    <main id="content">
      <h1>contact /</h1>
      <p class="lede">Email and Signal are the easiest ways to reach me.</p>

      <section aria-label="Contact methods">
        <dl>
          <div class="row">
            <dt>email</dt>
            <dd>
              <strong><a href="mailto:rae@raelovejoy.com">rae@raelovejoy.com</a></strong>
            </dd>
          </div>

          <div class="row">
            <dt>signal</dt>
            <dd>
              <strong><a href="https://signal.me/#eu/-vpszDHcQ9jp5lguX86eFWVZwipyAz6Y7cz-N9o9ezh0XbOiGdhAwL5alzyWZBOt">message me on Signal</a></strong>
              <span class="secondary">username: r43.10</span>
            </dd>
          </div>

          <div class="row">
            <dt>pgp</dt>
            <dd>
              <strong><a href="/index_files/Rae_9AFEE525.asc" download>download public key</a></strong>
              <span class="secondary">existing key; I may replace/update this later</span>
            </dd>
          </div>
        </dl>
      </section>
    </main>

    <footer>
      <nav class="social" aria-label="Elsewhere">
        <a rel="me" href="https://github.com/raelovejoy">github</a>
        <a rel="me" href="https://kolektiva.social/@raelovejoy">mastodon</a>
        <a rel="me" href="https://pixelfed.social/raelovejoy">pixelfed</a>
      </nav>

      <span class="etc">etc etc etc</span>
    </footer>
  </div>
</body>
</html>
